<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="amberPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.25" />
    </pattern>

    <style>
      .bg-grid { animation: gridFade 8s ease-in-out infinite alternate; }
      .orb-1 { animation: floatOrb1 12s ease-in-out infinite alternate; }
      .orb-2 { animation: floatOrb2 10s ease-in-out infinite alternate; }
      .orb-3 { animation: floatOrb3 14s ease-in-out infinite alternate; }
      .pulse-line { stroke-dasharray: 8 6; animation: dash 20s linear infinite; }
      .pulse-line-rev { stroke-dasharray: 6 6; animation: dashRev 16s linear infinite; }
      .node-float-1 { animation: nodeFloat1 6s ease-in-out infinite alternate; }
      .node-float-2 { animation: nodeFloat2 7s ease-in-out infinite alternate; }
      .node-float-3 { animation: nodeFloat3 8s ease-in-out infinite alternate; }
      .tag-pill { transition: all 0.3s ease; }

      @keyframes dash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes dashRev {
        to { stroke-dashoffset: 200; }
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 40px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-50px, -30px) scale(1.2); }
      }
      @keyframes floatOrb3 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(40px, -50px) scale(1.1); }
      }
      @keyframes nodeFloat1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes nodeFloat2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(10px); }
      }
      @keyframes nodeFloat3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
      @keyframes gridFade {
        0% { opacity: 0.35; }
        100% { opacity: 0.7; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Ambient Nebula Orbs (Kept behind and away from center text) -->
  <g opacity="0.45">
    <circle class="orb-1" cx="150" cy="80" r="180" fill="#6366f1" filter="url(#glow)" opacity="0.35" />
    <circle class="orb-2" cx="1050" cy="320" r="210" fill="#8b5cf6" filter="url(#glow)" opacity="0.3" />
    <circle class="orb-3" cx="950" cy="70" r="150" fill="#ec4899" filter="url(#glow)" opacity="0.25" />
    <circle class="orb-1" cx="200" cy="350" r="140" fill="#06b6d4" filter="url(#glow)" opacity="0.25" />
  </g>

  <!-- Infinite Canvas Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" class="bg-grid" />

  <!-- Background Decorative Dynamic Mind Map Branches & Nodes -->
  <!-- Left Side Branches (Positioned away from text zone) -->
  <g opacity="0.75" class="node-float-1">
    <path d="M 80 180 C 130 180, 150 120, 200 120" fill="none" stroke="#6366f1" stroke-width="2.5" class="pulse-line" />
    <path d="M 80 180 C 120 180, 140 240, 190 260" fill="none" stroke="#06b6d4" stroke-width="2" class="pulse-line-rev" />
    <path d="M 200 120 C 240 120, 250 80, 280 80" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 4" />
    <path d="M 200 120 C 240 120, 250 150, 280 150" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 4" />
    
    <!-- Mini Nodes -->
    <rect x="35" y="160" width="80" height="40" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" filter="url(#subtleGlow)" />
    <text x="75" y="185" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🧠 Brainstorm</text>

    <circle cx="200" cy="120" r="8" fill="#8b5cf6" filter="url(#subtleGlow)" />
    <circle cx="190" cy="260" r="7" fill="#06b6d4" filter="url(#subtleGlow)" />
    <circle cx="280" cy="80" r="5" fill="#ec4899" />
    <circle cx="280" cy="150" r="5" fill="#a855f7" />
  </g>

  <!-- Right Side Dynamic Flow (Positioned away from text zone) -->
  <g opacity="0.75" class="node-float-2">
    <path d="M 1120 190 C 1060 190, 1040 120, 980 120" fill="none" stroke="#ec4899" stroke-width="2" class="pulse-line" />
    <path d="M 1120 190 C 1070 190, 1050 260, 990 270" fill="none" stroke="#a855f7" stroke-width="2.5" class="pulse-line-rev" />
    <path d="M 980 120 C 940 120, 930 80, 890 80" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Mini Nodes -->
    <rect x="1070" y="170" width="85" height="40" rx="10" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" filter="url(#subtleGlow)" />
    <text x="1112" y="195" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Flowcharts</text>

    <circle cx="980" cy="120" r="8" fill="#ec4899" filter="url(#subtleGlow)" />
    <circle cx="990" cy="270" r="7" fill="#8b5cf6" filter="url(#subtleGlow)" />
    <circle cx="890" cy="80" r="5" fill="#f43f5e" />
  </g>

  <!-- Floating Feature Badges (Edges, away from center) -->
  <g class="node-float-3" opacity="0.85">
    <!-- Top-left tag -->
    <rect x="90" y="45" width="130" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="104" cy="59" r="4" fill="#38bdf8" />
    <text x="115" y="64" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Infinite Canvases</text>

    <!-- Top-right tag -->
    <rect x="970" y="45" width="140" height="28" rx="14" fill="#0f172a" stroke="#ec4899" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="985" cy="59" r="4" fill="#ec4899" />
    <text x="996" y="64" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Radial Mind Maps</text>

    <!-- Bottom-left tag -->
    <rect x="80" y="345" width="150" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="95" cy="359" r="4" fill="#a855f7" />
    <text x="106" y="364" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Local-First &amp; CRDT</text>

    <!-- Bottom-right tag -->
    <rect x="960" y="345" width="155" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="975" cy="359" r="4" fill="#10b981" />
    <text x="986" y="364" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Diagramming as Code</text>
  </g>

  <!-- Center Safe Card (Glassmorphism backdrop to guarantee foreground text readability) -->
  <rect x="230" y="55" width="740" height="310" rx="24" fill="#0b1120" fill-opacity="0.75" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Top Pill / Category -->
  <g transform="translate(600, 100)">
    <rect x="-140" y="-15" width="280" height="30" rx="15" fill="#1e1b4b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.2" filter="url(#subtleGlow)" />
    <text x="0" y="5" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">🎨 AWESOME CURATED ECOSYSTEM</text>
  </g>

  <!-- Main Title (Strictly Foregrounded & High Contrast) -->
  <text x="600" y="175" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.8" text-anchor="middle" filter="url(#subtleGlow)">
    Creative Flow &amp; Mind Mapping
  </text>

  <!-- Subtitle (Clear, readable, high contrast) -->
  <text x="600" y="222" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
    Infinite Canvases • Mind Maps • Spatial Ideation • Visual Thinking
  </text>

  <!-- Description / Meta -->
  <text x="600" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" text-anchor="middle">
    The ultimate curated collection of enterprise SaaS platforms and open-source visual thinking tools
  </text>

  <!-- Tag Pills Row Inside Center Card -->
  <g transform="translate(600, 315)">
    <!-- Pill 1 -->
    <g transform="translate(-230, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="0" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">✨ Infinite Canvases</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-75, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="0" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">🧠 Mind Mapping</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(80, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="0" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">📐 Diagram-as-Code</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(230, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="0" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">🚀 Local-First</text>
    </g>
  </g>
</svg>